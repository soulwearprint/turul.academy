name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after ~7 days of no database activity.
# This pings the REST API every 3 days so Turul Academy never idles out while
# we're still in the quiet pre-launch phase. Once real testers hit it daily,
# this becomes redundant (but harmless).
#
# The key below is the PUBLISHABLE (anon) key — it is already public in the
# deployed frontend bundle, so it is safe to commit. It is not a secret.

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC
  workflow_dispatch: {}      # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Turul Academy database
        env:
          SUPABASE_URL: https://tqsrwhvvghryycgsxfsj.supabase.co
          SUPABASE_KEY: sb_publishable__RXVTiIc8H-54WUKMbe7dQ_jFXLN_-F
        run: |
          # On a DNS/connect failure curl still prints "000" via -w AND exits non-zero.
          # The old `$(curl … || echo "000")` therefore produced "000000", which
          # didn't match "000" — so the 2026-09-22 run passed green while the project
          # was already paused. Assign the fallback outside the substitution instead,
          # and only count a 2xx as healthy: a paused project answers 5xx (521/540).
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/curriculum_subjects?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}") || code="000"
            echo "Attempt ${attempt}: Academy REST ping → HTTP ${code}"
            case "$code" in 2??) break ;; esac
            [ "$attempt" -lt 3 ] && sleep 5
          done
          case "$code" in
            2??) ;;
            *) echo "::error::Supabase answered HTTP ${code} after 3 attempts — project is likely paused. Restore it in the Supabase dashboard."
               exit 1 ;;
          esac
